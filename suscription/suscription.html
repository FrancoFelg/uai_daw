<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase02 DAW</title>
    <link rel="stylesheet" href="suscription.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
</head>

<body>

    <header class="m-0">
        <div class="bbc-logo-container">
            <img src="../public/images/BBClogo.svg" class="bbc-logo">
        </div>

        <div class="news-header">
            <p><strong>NEWS Mundo</strong></p>

            <ul class="news-header-list">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="#">Formulario</a></li>
                <li><a href="#">Noticias</a></li>
                <li><a href="#">Video</a></li>
                <li><a href="#">Audio</a></li>
            </ul>
        </div>
    </header>
    <div id="burguerMenu">
        <div class="news-header">
            <img src="public/images/BBClogo.svg" class="bbc-logo">
            <img class="burguerMenuIcon" src="public/images/menu-burger.png">
        </div>
    </div>

    <div class="main-container">
        <main class="main">
            <div class="form-container">
                <h1 id="form-heading">HOLA <span id="dynamic-title"></span></h1>

                <form id="subscription-form" class="form-container" novalidate>

                    <div class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre">
                        <div class="error-message" id="error-nombre"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                        <div class="error-message" id="error-email"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password">
                        <div class="error-message" id="error-password"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Repetir contraseña:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword">
                        <div class="error-message" id="error-confirmPassword"></div>
                    </div>

                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad">
                        <div class="error-message" id="error-edad"></div>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                        <div class="error-message" id="error-telefono"></div>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion">
                        <div class="error-message" id="error-direccion"></div>
                    </div>

                    <div class="form-group">
                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad">
                        <div class="error-message" id="error-ciudad"></div>
                    </div>

                    <div class="form-group">
                        <label for="codigoPostal">Código Postal:</label>
                        <input type="text" id="codigoPostal" name="codigoPostal">
                        <div class="error-message" id="error-codigoPostal"></div>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" name="dni">
                        <div class="error-message" id="error-dni"></div>
                    </div>

                    <div class="btn-submit-container">
                        <button type="submit" id="btn-enviar">Enviar</button>
                    </div>

                </form>
            </div>
        </main>
    </div>


    <footer class="footer">
        <div class="news-header">
            <p><strong>NEWS Mundo</strong></p>
        </div>
    </footer>

    <script src="suscription.js"></script>
</body>

</html>
